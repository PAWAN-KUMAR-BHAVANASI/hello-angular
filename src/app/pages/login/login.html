<section class="card login-card">
  <p class="eyebrow">Account</p>
  <h1>Login</h1>

  <form [formGroup]="loginForm" (ngSubmit)="submitLogin()">
    <div class="field">
      <label for="email">
        Email<span class="required-mark">*</span>
      </label>
      <input id="email" formControlName="email" type="email" autocomplete="email" placeholder="name@example.com" />
    </div>

    <div class="field">
      <label for="password">
        Password<span class="required-mark">*</span>
      </label>
      <input id="password" formControlName="password" type="password" autocomplete="current-password" placeholder="Enter password" />
    </div>

    <label class="checkbox-row">
      <input type="checkbox" formControlName="rememberMe" />
      <span>Remember me</span>
    </label>

    <div class="form-actions">
      <button class="primary-btn" type="submit">Login</button>
    </div>

    @if (loginMessage) {
      <p [class.error-message]="loginError" [class.success-message]="!loginError" role="status">{{ loginMessage }}</p>
    }

    <a class="mode-toggle" routerLink="/signup">New here? Create an account</a>
  </form>
</section>
